<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#070a14"/>
  <!-- Top telemetry header -->
  <rect x="48" y="40" width="1104" height="64" rx="8" fill="#0d1326" stroke="#1c2748"/>
  <circle cx="80" cy="72" r="6" fill="#ff3366"/>
  <text x="100" y="68" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Topic Query: "Mobile UI Architecture"</text>
  <text x="100" y="86" fill="#8b9bc0" font-family="system-ui, sans-serif" font-size="12">RoBERTa Sentiment + DeBERTa v3 Zero-Shot Stance · 14,820 posts analyzed</text>
  <rect x="980" y="56" width="148" height="32" rx="6" fill="#141e38"/>
  <text x="1054" y="77" text-anchor="middle" fill="#38eef8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">WORKER IDLE · 42ms</text>

  <!-- Main Chart Card (Left 2/3) -->
  <rect x="48" y="128" width="720" height="544" rx="10" fill="#0d1326" stroke="#1c2748"/>
  <text x="80" y="172" fill="#8b9bc0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Net Sentiment Polarity Over 14 Days</text>
  <text x="80" y="212" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="34" font-weight="700">+68.4%</text>
  <text x="218" y="210" fill="#38eef8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">+14.2% vs prior 14d</text>

  <!-- Horizontal muted gridlines -->
  <g stroke="#1b2646" stroke-width="1">
    <line x1="80" y1="260" x2="736" y2="260"/>
    <line x1="80" y1="350" x2="736" y2="350"/>
    <line x1="80" y1="440" x2="736" y2="440"/>
    <line x1="80" y1="530" x2="736" y2="530"/>
    <line x1="80" y1="610" x2="736" y2="610"/>
  </g>
  <!-- Area & Single Accent Line -->
  <path d="M 80 510 L 180 480 L 280 490 L 380 410 L 480 375 L 580 390 L 680 295 L 736 275 L 736 610 L 80 610 Z" fill="#38eef8" fill-opacity="0.08"/>
  <path d="M 80 510 L 180 480 L 280 490 L 380 410 L 480 375 L 580 390 L 680 295 L 736 275" fill="none" stroke="#38eef8" stroke-width="3.5"/>
  <circle cx="680" cy="295" r="6" fill="#070a14" stroke="#38eef8" stroke-width="3"/>
  <circle cx="736" cy="275" r="6" fill="#ff3366" stroke="#f4f6fb" stroke-width="2.5"/>

  <!-- Right Column: Stance Breakdown & Queue -->
  <rect x="792" y="128" width="360" height="260" rx="10" fill="#0d1326" stroke="#1c2748"/>
  <text x="824" y="172" fill="#8b9bc0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">DeBERTa Zero-Shot Stance Share</text>
  <!-- Agree Bar -->
  <text x="824" y="214" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Agree / Supportive</text>
  <text x="1120" y="214" text-anchor="end" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="14" font-weight="600">64%</text>
  <rect x="824" y="224" width="296" height="10" rx="4" fill="#182240"/>
  <rect x="824" y="224" width="190" height="10" rx="4" fill="#38eef8"/>
  <!-- Neutral Bar -->
  <text x="824" y="270" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Neutral / Analytical</text>
  <text x="1120" y="270" text-anchor="end" fill="#8b9bc0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">22%</text>
  <rect x="824" y="280" width="296" height="10" rx="4" fill="#182240"/>
  <rect x="824" y="280" width="65" height="10" rx="4" fill="#63749e"/>
  <!-- Disagree Bar -->
  <text x="824" y="326" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Contested / Critical</text>
  <text x="1120" y="326" text-anchor="end" fill="#ff3366" font-family="system-ui, sans-serif" font-size="14" font-weight="600">14%</text>
  <rect x="824" y="336" width="296" height="10" rx="4" fill="#182240"/>
  <rect x="824" y="336" width="42" height="10" rx="4" fill="#ff3366"/>

  <!-- Bottom Right Card: Pipeline Telemetry -->
  <rect x="792" y="412" width="360" height="260" rx="10" fill="#0d1326" stroke="#1c2748"/>
  <text x="824" y="454" fill="#8b9bc0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Ingestion &amp; Inference Pipeline</text>
  <text x="824" y="498" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="14">Reddit PRAW Stream</text>
  <text x="1120" y="498" text-anchor="end" fill="#38eef8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">9,410 docs</text>
  <line x1="824" y1="516" x2="1120" y2="516" stroke="#1b2646"/>
  <text x="824" y="548" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="14">Playwright X/Twitter Sync</text>
  <text x="1120" y="548" text-anchor="end" fill="#38eef8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">5,410 docs</text>
  <line x1="824" y1="566" x2="1120" y2="566" stroke="#1b2646"/>
  <text x="824" y="598" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="14">MongoDB Aggregation Latency</text>
  <text x="1120" y="598" text-anchor="end" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="14" font-weight="600">18 ms</text>
</svg>
