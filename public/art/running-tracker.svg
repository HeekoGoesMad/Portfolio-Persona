<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#060a14"/>
  <!-- Left MapLibre Route Canvas -->
  <rect x="48" y="40" width="680" height="640" rx="10" fill="#0b1224" stroke="#1b284a"/>
  <g stroke="#142040" stroke-width="1">
    <line x1="48" y1="168" x2="728" y2="168"/>
    <line x1="48" y1="296" x2="728" y2="296"/>
    <line x1="48" y1="424" x2="728" y2="424"/>
    <line x1="48" y1="552" x2="728" y2="552"/>
    <line x1="218" y1="40" x2="218" y2="680"/>
    <line x1="388" y1="40" x2="388" y2="680"/>
    <line x1="558" y1="40" x2="558" y2="680"/>
  </g>
  <!-- GPS Loop Track -->
  <path d="M 160 540 C 140 380, 240 200, 390 180 C 540 160, 620 260, 590 410 C 560 540, 320 590, 160 540 Z" fill="#38eef8" fill-opacity="0.05" stroke="#38eef8" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="160" cy="540" r="10" fill="#060a14" stroke="#f4f6fb" stroke-width="4"/>
  <circle cx="390" cy="180" r="9" fill="#38eef8"/>
  <circle cx="590" cy="410" r="11" fill="#ff3366" stroke="#f4f6fb" stroke-width="3"/>
