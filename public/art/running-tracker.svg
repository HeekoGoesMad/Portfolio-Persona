  <text x="100" y="99" fill="#38eef8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">GPS LOCK · OFFLINE ROOM DB</text>

  <!-- Right Telemetry & Coach Panel -->
  <rect x="752" y="40" width="400" height="640" rx="10" fill="#0b1224" stroke="#1b284a"/>
  <text x="788" y="88" fill="#8b9bc0" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Morning Threshold Run · Split Telemetry</text>
  <text x="788" y="146" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="48" font-weight="700">10.42 km</text>
  <text x="788" y="178" fill="#38eef8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">4:42 /km avg pace · 48m 58s</text>

  <line x1="788" y1="210" x2="1116" y2="210" stroke="#1b284a"/>

  <!-- Split Bars -->
  <text x="788" y="244" fill="#8b9bc0" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Kilometer Splits (min/km)</text>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#f4f6fb">
    <text x="788" y="282">KM 1</text>
    <rect x="848" y="270" width="180" height="12" rx="3" fill="#2a3d6e"/>
    <text x="1116" y="282" text-anchor="end">4:51</text>

    <text x="788" y="322">KM 3</text>
    <rect x="848" y="310" width="196" height="12" rx="3" fill="#2a3d6e"/>
    <text x="1116" y="322" text-anchor="end">4:45</text>

    <text x="788" y="362">KM 5</text>
    <rect x="848" y="350" width="214" height="12" rx="3" fill="#38eef8"/>
    <text x="1116" y="362" text-anchor="end" fill="#38eef8" font-weight="700">4:34</text>

    <text x="788" y="402">KM 8</text>
    <rect x="848" y="390" width="204" height="12" rx="3" fill="#2a3d6e"/>
    <text x="1116" y="402" text-anchor="end">4:39</text>

    <text x="788" y="442">KM 10</text>
    <rect x="848" y="430" width="222" height="12" rx="3" fill="#ff3366"/>
    <text x="1116" y="442" text-anchor="end" fill="#ff3366" font-weight="700">4:29</text>
  </g>

  <!-- Adaptive Coach Proposal Box -->
  <rect x="788" y="492" width="328" height="152" rx="8" fill="#060a14" stroke="#253868"/>
  <text x="812" y="524" fill="#38eef8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">ADAPTIVE COACH DIFF</text>
  <text x="812" y="552" fill="#f4f6fb" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Thursday Interval Session</text>
  <text x="812" y="578" fill="#8b9bc0" font-family="system-ui, sans-serif" font-size="12">Target adjusted 4:40 → 4:35 /km based on</text>
  <text x="812" y="596" fill="#8b9bc0" font-family="system-ui, sans-serif" font-size="12">today's negative split recovery margin.</text>
